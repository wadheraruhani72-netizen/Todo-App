<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ToDo App with Storage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Left Pane: Task List -->
    <div class="left-pane">
      <h2>TASK LIST</h2>
      <ul id="task-list"></ul>
    </div>

    <!-- Right Pane: Textarea -->
    <div class="right-pane">
      <h2>I need to...</h2>
      <textarea id="task-textarea" placeholder="Type a task and press enter..."></textarea>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
